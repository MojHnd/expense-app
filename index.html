<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <title>Expenses</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Sections" hidden>
    <a href="#/month" data-tab="month"><span class="tab-icon" aria-hidden="true">▦</span>Month</a>
    <a href="#/history" data-tab="history"><span class="tab-icon" aria-hidden="true">▤</span>History</a>
    <a href="#/trends" data-tab="trends"><span class="tab-icon" aria-hidden="true">◔</span>Trends</a>
    <a href="#/settings" data-tab="settings"><span class="tab-icon" aria-hidden="true">⚙</span>Settings</a>
  </nav>

  <section class="lock" id="lock" hidden>
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h1>Expenses is locked</h1>
      <p class="muted">Use Face ID or Windows Hello to open the app.</p>
      <button class="btn primary" id="unlock-btn" type="button">Unlock</button>
      <p class="error" id="lock-error" role="alert"></p>
      <p class="muted small">Passkey lost? Clear the website data for this site in the browser settings, then set up sync again. Your data comes back from GitHub.</p>
    </div>
  </section>

  <dialog id="sheet" class="sheet"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
